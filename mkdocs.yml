site_name: Sarra Amri · Technical Writer & QA
site_url: https://sarraamri.github.io/
site_description: Technical Writer at Vneuron · QA in practice. Documentation, testing, docs-as-code.
repo_url: https://github.com/Sarraamri/sarraamri.github.io
repo_name: Sarraamri/sarraamri.github.io

theme:
  name: material
  custom_dir: overrides
  language: en
  font:
    text: Nunito
    code: JetBrains Mono
  icon:
    logo: material/book-open-page-variant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - announce.dismiss
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css?v=4

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Sarraamri
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/sarra-amri-019902217
    - icon: fontawesome/solid/envelope
      link: mailto:sarraamri2508@gmail.com

nav:
  - Home: index.md
  - Writing:
      - User guides and technical docs: writing/reis-user-guides.md
      - New product doc set from scratch: writing/tbml-doc-set.md
      - Docs QA checklist: writing/docs-qa-checklist.md
  - QA Work:
      - Defects I find while documenting: qa/defects.md
      - Postman collection in CI: qa/postman-ci.md
      - Test scenarios for a new product: qa/test-scenarios.md
  - Projects:
      - projects/index.md
      - Application containerisation: projects/reis-kubernetes.md
      - Manufacturing-order tracking at SAFRAN: projects/safran-manufacturing.md
      - Terraform auto-generated docs: projects/terraform-docs.md
      - Front-end projects: projects/frontend.md
  - About: about.md
